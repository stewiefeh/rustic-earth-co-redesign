<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion diag | Rustic Earth QA</title>
<script>document.documentElement.classList.add('js');try{if(CSS.supports('animation-timeline','view()'))document.documentElement.classList.add('v5css')}catch(e){}</script>
<link rel="stylesheet" href="../css/style.css?v=11">
<style>body{padding:0}#out{font:13px/1.5 monospace;white-space:pre-wrap;background:#fff;color:#111;padding:14px;border:2px solid #A6472E;margin:16px 0;max-width:900px}.probe{padding:18px;margin:12px 0;max-width:520px}</style>
</head><body>
<main style="padding:24px">
<h1>Motion diag</h1>
<pre id="out">booting…</pre>
<div class="probe reveal" id="pA" style="background:#D99A33">probe A: .reveal (rv-up + view() + entry range + backwards)</div>
<div class="probe reveal reveal-s" id="pB" style="background:#A6472E;color:#fff">probe B: .reveal.reveal-s</div>
<div class="probe" id="pC" style="background:#382C21;color:#fff">probe C: control, no reveal class</div>
<div class="probe reveal reveal-l" id="pD" style="background:#2A2018;color:#fff;margin-top:1400px">probe D: .reveal.reveal-l, far below</div>
<div style="height:1400px"></div>
</main>
<script>
const probes=['pA','pB','pC','pD'];
function rep(tag){
  const L=['== '+tag+' ==','scrollY='+Math.round(scrollY),'supports view()='+CSS.supports('animation-timeline','view()'),'htmlClass='+document.documentElement.className];
  probes.forEach(id=>{
    const el=document.getElementById(id);
    const cs=getComputedStyle(el);
    const r=el.getBoundingClientRect();
    L.push(id+': top='+Math.round(r.top)+' opacity='+cs.opacity+' transform='+cs.transform+' name='+cs.animationName+' tl='+cs.animationTimeline+' range='+(cs.animationRange||'none'));
    el.getAnimations().forEach(a=>{L.push(id+' anim: '+a.constructor.name+' state='+a.playState+' t='+(a.currentTime?a.currentTime.toString():'null')+' animTl='+(a.timeline?a.timeline.constructor.name:'none')+' fill='+(a.effect&&a.effect.fill));});
  });
  document.getElementById('out').textContent=L.join('\n');
}
addEventListener('load',()=>{
  rep('load (scroll 0)');
  let step=0;const seq=[900,2400,0];
  function cycle(){const y=seq[step%3];step++;scrollTo(0,y);setTimeout(()=>rep('scrolled to '+y),700);}
  setInterval(cycle,2600);rep('load (scroll 0)');
});
</script></body></html>
